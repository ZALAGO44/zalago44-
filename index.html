<!-- BINANCE SUPPORT CHAT - EXACT LIKE YOUR SCREENSHOT -->
<div id="chat" class="hidden fixed inset-0 bg-[#F5F5F5] z-[100] flex flex-col">
  <!-- Header EXACT like Binance Support screenshot -->
  <div class="bg-white p-3 flex items-center gap-3 border-b">
    <button onclick="document.getElementById('chat').classList.add('hidden')" class="text-xl"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="w-10 h-10 bg-[#FCD535] rounded-lg flex items-center justify-center text-xl">🙂</div>
    <div class="flex-1">
      <p class="font-bold text-[16px] leading-tight">ZALAGO44 Support</p>
      <p class="text-xs text-gray-500">Ask me anything</p>
    </div>
    <i class="fa-solid fa-globe text-xl text-gray-700"></i>
  </div>

  <!-- View Chat History like screenshot -->
  <div class="bg-[#F5F5F5] p-4 flex justify-center">
    <span class="text-sm text-gray-500"><i class="fa-solid fa-arrow-up text-xs"></i> View Chat History</span>
  </div>

  <!-- Chat bubble EXACT like screenshot -->
  <div class="flex-1 bg-[#F5F5F5] p-4">
    <div class="bg-white rounded-2xl rounded-tl-sm p-4 shadow-sm max-w-[85%]">
      <p class="text-[15px] leading-snug"><span class="text-xl">👋</span> Welcome to ZALAGO44 Support. How can I help you today?</p>
    </div>
  </div>

  <!-- Bottom input EXACT like screenshot -->
  <div class="bg-[#F5F5F5] p-3 flex items-center gap-3 pb-6">
    <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm"><i class="fa-solid fa-plus text-xl text-gray-700"></i></button>
    <div class="flex-1 bg-white rounded-full px-4 py-3 shadow-sm">
      <input id="chatInput" placeholder="Enter question here" class="w-full outline-none text-[15px] bg-transparent">
    </div>
  </div>
</div>
